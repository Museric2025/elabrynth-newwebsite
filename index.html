
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Elabrynth — official band website. Coming soon.">

    <title>Elabrynth | Coming Soon</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: #000;
            color: #fff;
        }

        /* Background photograph */

        body {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.65)
                ),
                url('theband.PNG');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Main page layout */

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 18px;
            text-align: center;
        }

        /* Band logo */

        .logo {
            display: block;
            width: min(92vw, 1100px);
            height: auto;
            mix-blend-mode: screen;
            scale: 0.8;
        }

        /* Coming Soon */

        h1 {
            margin: 25px 0 0;
            font-size: clamp(12px, 1.5vw, 17px);
            font-weight: 400;
            letter-spacing: 0.48em;
            text-indent: 0.48em;
            text-align: center;
        }

        /* Email address */

        .contact-email {
            display: block;
            margin-top: 25px;
            font-size: 14px;
            letter-spacing: 2px;
            color: #999;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-email:hover {
            color: #fff;
        }

        /* Photography credit */

        .photo-credit {
            display: block;
            margin-top: 15px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #aaa;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .photo-credit:hover {
            color: #fff;
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 18px;
            color: #777;
            font-size: 11px;
            letter-spacing: 0.18em;
        }

        /* Mobile layout */

        @media (max-width: 768px) {
            body {
                background-size: 100% auto;
                background-position: center;
                background-attachment: scroll;
                background-color: #000;
            }
        }

        /* Fade-in animation */

        @media (prefers-reduced-motion: no-preference) {

            .logo, h1, .contact-email, .photo-credit {
                animation: appear 1.1s ease-out both;
            }

            h1 {
                animation-delay: 0.2s;
            }

            .contact-email {
                animation-delay: 0.4s;
            }

            .photo-credit {
                animation-delay: 0.6s;
            }

            @keyframes appear {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

    </style>
</head>

<body>

    <main>

        <img class="logo"
             src="logo.jpg"
             alt="Elabrynth band logo"
             width="1824"
             height="768">

        <h1>COMING SOON</h1>

        <a href="mailto:admin@elabrynth.com"
           class="contact-email">
            admin@elabrynth.com
        </a>

        <a href="https://www.keithclarkphotography.com/"
           class="photo-credit"
           target="_blank"
           rel="noopener noreferrer">
            Photography by Keith Clark
        </a>

    </main>

    <footer>ELABRYNTH.COM</footer>

</body>
</html>
