<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Elabrynth — official website. Coming soon.">
  <title>Elabrynth | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
    body { min-height: 100svh; display: flex; flex-direction: column; font-family: Arial, Helvetica, sans-serif; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(28px, 6vh, 65px); padding: 32px 18px; }
    .logo { display: block; width: min(92vw, 1100px); height: auto; }
    h1 { margin: 0; font-size: clamp(12px, 1.5vw, 17px); font-weight: 400; letter-spacing: .48em; text-indent: .48em; text-align: center; }
    footer { text-align: center; padding: 18px; color: #777; font-size: 11px; letter-spacing: .18em; }
    @media (prefers-reduced-motion: no-preference) { .logo, h1 { animation: appear 1.1s ease-out both; } h1 { animation-delay: .2s; } @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } } }
 .contact-email {
    display: block;
    margin-top: 25px;
    font-size: 24px;
    letter-spacing: 2px;
    color: #999;
    text-decoration: none;
    transition: color 0.3s ease;
}

.contact-email:hover {
    color: #fff;
}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpg" alt="Elabrynth band logo" width="1824" height="768">
    <h1>COMING SOON</h1>
    <a href="mailto:admin@elabrynth.com" class="contact-email">
    admin@elabrynth.com
</a>
  </main>
  <footer>ELABRYNTH.COM</footer>
</body>
